allowBuilds:
  '@swc/core': true
  esbuild: true
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

packages:
  - '.'
  - 'packages/*'
  - 'apps/*'

# Vite+ toolchain: alias `vite` to the Vite+ core so `vp` drives the build,
# matching hybr1d-frontend / headless-view.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0

overrides:
  minimatch@10: ^11.0.1
  vite@*: 'catalog:'
  # Security: force patched versions of vulnerable transitive deps (Dependabot).
  # Both arrive via react-select (a peer dep, externalized from the build).
  '@babel/runtime': '^7.26.10' # GHSA-968p-4wvh-cqc8 (ReDoS), fixed in 7.26.10
  yaml: '^1.10.3' # GHSA-48c2-rrv3-qjmp (DoS), fixed in 1.10.3; stay on v1 for cosmiconfig@7

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

minimumReleaseAgeExclude:
  - '@microsoft/api-extractor-model@7.33.11'
  - '@microsoft/api-extractor@7.58.13'
  - '@rushstack/node-core-library@5.24.0'
  - '@rushstack/terminal@0.24.3'
  - '@rushstack/ts-command-line@5.3.13'
  - '@vitejs/plugin-react@6.1.0'
  - happy-dom@20.11.6
  - '@hybr1d-tech/groudon@1.0.0'
  - '@voidzero-dev/vite-plus-core@1.6.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.6.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.6.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.6.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0'
  - vite-plus@1.6.0
