name: Publish to npm

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: ["*"]
# Serialize releases so a main push and its tag cannot publish concurrently.
concurrency:
  group: npm-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Vite+ (node 24 + pnpm + npm auth)
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
          registry-url: "https://registry.npmjs.org"
      - name: Install Packages
        run: vp install
      - name: Build
        run: vp run build
      - name: Check release version
        id: release
        if: github.event_name == 'push'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const ref = process.env.GITHUB_REF;
          if (ref.startsWith('refs/tags/') && ref !== `refs/tags/v${version}`) {
            throw new Error(`Tag ${ref} does not match package version ${version}`);
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm version lookup failed: ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${response.status === 404}\n`);
          console.log(response.ok ? `${name}@${version} already published; skipping` : `Publishing ${name}@${version}`);
          NODE
      - name: Publish Package
        if: steps.release.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: slack - build success
        uses: act10ns/slack@v2.2.0
        with:
          status: ${{ job.status }}
          channel: '#alerts-deploys'
          message:
            'Charizard was successfully published to npm'
        if: success() && steps.release.outputs.publish == 'true'
      - name: slack - build failed
        uses: act10ns/slack@v2.2.0
        with:
          status: ${{ job.status }}
          channel: '#alerts-deploys'
          message:
            'Charizard has failed to publish to npm'
        if: failure() && github.event_name == 'push'
